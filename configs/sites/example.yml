site: example

agent:
  mode: passive-listening
  sub_mode: read-only
  store_timeout_seconds: 30
  test_duration_seconds: 60
  test_only_valid_crc: false

nports:
  - name: port_1
    host: 192.0.2.10
    port: 4001
    device_type: generic
    idle_gap_ms: 50
    serial:
      baud: 19200
      data_bits: 8
      parity: even
      stop_bits: 1
    detected_slaves:
      - 1
    slaves:
      - name: device_1
        address: 1
        registers:
          - register: 0
            register_name: value0
            register_type: int16

storage:
  outputs:
    - name: local_timescale_shadow
      type: timescaledb_shadow
      enabled: true
      timescaledb_shadow:
        host_env: TIMESCALE_HOST_LOCAL
        port_env: TIMESCALE_PORT_LOCAL
        user_env: TIMESCALE_USER_LOCAL
        password_env: TIMESCALE_PASSWORD_LOCAL
        database_env: TIMESCALE_DB_LOCAL
        schema: edge
        table: example_nport_shadow
